<svg width="1000" height="900" viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="1000" height="900" fill="#ffffff"/>

<text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Wiring / pin connection diagram</text>
<text x="500" y="54" text-anchor="middle" font-size="12" fill="#5f5e5a">Reference wiring, not a formal schematic. See connection-map.md for full detail.</text>

<!-- Central MCU -->
<rect x="400" y="410" width="200" height="80" rx="10" fill="#eeedfe" stroke="#534ab7" stroke-width="1.5"/>
<text x="500" y="445" text-anchor="middle" font-size="15" font-weight="bold" fill="#26215c">Arduino</text>
<text x="500" y="465" text-anchor="middle" font-size="11" fill="#3c3489">Microcontroller</text>

<!-- helper style -->
<g font-size="12" fill="#2c2c2a">

<!-- Soil moisture: top-left -->
<rect x="60" y="70" width="170" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="145" y="90" text-anchor="middle" font-weight="bold">Soil moisture</text>
<text x="145" y="106" text-anchor="middle" font-size="10" fill="#5f5e5a">AO -> A0</text>
<line x1="230" y1="95" x2="398" y2="420" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Temperature NTC -->
<rect x="280" y="70" width="170" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="365" y="90" text-anchor="middle" font-weight="bold">Temp (NTC)</text>
<text x="365" y="106" text-anchor="middle" font-size="10" fill="#5f5e5a">A1, via 10k divider</text>
<line x1="365" y1="120" x2="440" y2="410" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- LDR -->
<rect x="500" y="70" width="170" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="585" y="90" text-anchor="middle" font-weight="bold">LDR light</text>
<text x="585" y="106" text-anchor="middle" font-size="10" fill="#5f5e5a">A2, via 10k divider</text>
<line x1="585" y1="120" x2="540" y2="410" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Water level probes -->
<rect x="720" y="70" width="180" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="810" y="90" text-anchor="middle" font-weight="bold">Water level (4 probes)</text>
<text x="810" y="106" text-anchor="middle" font-size="10" fill="#5f5e5a">D4-D7</text>
<line x1="770" y1="120" x2="600" y2="420" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- DHT22 -->
<rect x="60" y="160" width="170" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="145" y="180" text-anchor="middle" font-weight="bold">DHT22 humidity</text>
<text x="145" y="196" text-anchor="middle" font-size="10" fill="#5f5e5a">D11, 10k pull-up</text>
<line x1="230" y1="185" x2="398" y2="430" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Rain sensor -->
<rect x="720" y="160" width="180" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="810" y="180" text-anchor="middle" font-weight="bold">Rain sensor</text>
<text x="810" y="196" text-anchor="middle" font-size="10" fill="#5f5e5a">AO -> A3</text>
<line x1="770" y1="185" x2="600" y2="430" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- pH sensor -->
<rect x="60" y="250" width="170" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="145" y="270" text-anchor="middle" font-weight="bold">Soil pH</text>
<text x="145" y="286" text-anchor="middle" font-size="10" fill="#5f5e5a">AO -> A4, calibrate first</text>
<line x1="230" y1="275" x2="398" y2="440" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Flow sensor -->
<rect x="720" y="250" width="180" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1"/>
<text x="810" y="270" text-anchor="middle" font-weight="bold">Flow sensor</text>
<text x="810" y="286" text-anchor="middle" font-size="10" fill="#5f5e5a">D3, interrupt pin</text>
<line x1="770" y1="275" x2="600" y2="440" stroke="#0f6e56" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Bottom row: actuators -->
<rect x="60" y="700" width="180" height="60" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
<text x="150" y="724" text-anchor="middle" font-weight="bold">Water pump</text>
<text x="150" y="740" text-anchor="middle" font-size="10" fill="#5f5e5a">D8, via motor driver</text>
<line x1="240" y1="720" x2="400" y2="490" stroke="#993c1d" stroke-width="1" stroke-dasharray="4 3"/>

<rect x="280" y="700" width="200" height="60" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
<text x="380" y="724" text-anchor="middle" font-weight="bold">Solenoid valve</text>
<text x="380" y="740" text-anchor="middle" font-size="10" fill="#5f5e5a">D9 via relay + flyback diode</text>
<line x1="440" y1="700" x2="460" y2="490" stroke="#993c1d" stroke-width="1" stroke-dasharray="4 3"/>

<rect x="520" y="700" width="220" height="60" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
<text x="630" y="724" text-anchor="middle" font-weight="bold">Cooling / heating relays</text>
<text x="630" y="740" text-anchor="middle" font-size="10" fill="#5f5e5a">D10 / D13, + flyback diodes</text>
<line x1="600" y1="700" x2="550" y2="490" stroke="#993c1d" stroke-width="1" stroke-dasharray="4 3"/>

<rect x="780" y="700" width="160" height="60" rx="8" fill="#faece7" stroke="#993c1d" stroke-width="1"/>
<text x="860" y="724" text-anchor="middle" font-weight="bold">Light relay</text>
<text x="860" y="740" text-anchor="middle" font-size="10" fill="#5f5e5a">D12 + LED resistor</text>
<line x1="800" y1="700" x2="600" y2="480" stroke="#993c1d" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Support parts row -->
<rect x="60" y="410" width="230" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
<text x="175" y="434" text-anchor="middle" font-weight="bold">Decoupling capacitor</text>
<text x="175" y="450" text-anchor="middle" font-size="10" fill="#5f5e5a">0.1uF at MCU power pins</text>
<line x1="290" y1="440" x2="398" y2="440" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3"/>

<rect x="710" y="410" width="230" height="60" rx="8" fill="#f1efe8" stroke="#5f5e5a" stroke-width="1"/>
<text x="825" y="434" text-anchor="middle" font-weight="bold">Voltage regulator</text>
<text x="825" y="450" text-anchor="middle" font-size="10" fill="#5f5e5a">12V supply -> 5V logic</text>
<line x1="710" y1="440" x2="602" y2="440" stroke="#5f5e5a" stroke-width="1" stroke-dasharray="4 3"/>

<!-- Connectivity -->
<rect x="400" y="820" width="200" height="50" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1"/>
<text x="500" y="842" text-anchor="middle" font-weight="bold">Raspberry Pi</text>
<text x="500" y="858" text-anchor="middle" font-size="10" fill="#5f5e5a">via USB serial</text>
<line x1="500" y1="490" x2="500" y2="818" stroke="#185fa5" stroke-width="1.5"/>

</g>

<!-- Legend -->
<g font-size="11" fill="#5f5e5a">
<rect x="60" y="800" width="14" height="14" fill="#e1f5ee" stroke="#0f6e56"/>
<text x="80" y="811">Sensor (input)</text>
<rect x="220" y="800" width="14" height="14" fill="#faece7" stroke="#993c1d"/>
<text x="240" y="811">Actuator (output)</text>
<rect x="400" y="800" width="14" height="14" fill="#f1efe8" stroke="#5f5e5a"/>
<text x="420" y="811">Support / protection part</text>
</g>
</svg>
